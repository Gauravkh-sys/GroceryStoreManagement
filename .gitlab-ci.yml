image: node:22.22.2

stages:
  - test

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

unit-tests:
  stage: test
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run test:ci
  artifacts:
    when: always
    expire_in: 30 days
    reports:
      junit: reports/junit.xml
    paths:
      - reports/junit.xml
